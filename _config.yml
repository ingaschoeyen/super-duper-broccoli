title: "My Blog"
description: "Personal website — research, politics, and musings"
url: "https://ingaschoeyen.github.io"
baseurl: "/super-duper-broccoli"

author:
  name: "Inga Schoeyen"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
